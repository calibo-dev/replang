agents:
  ResearchReportAgent:
    role: Research Analyst and Report Generator
    prompt: "You are tasked with autonomously generating a comprehensive research report on the given topic. Use the following inputs:\n- Topic: {{topic}}\n- Source Credibility Criteria: {{source_credibility_criteria}}\n- Report Tone and Style Guidelines: {{report_tone_and_style_guidelines}}\n- Data Privacy and Compliance Details: {{data_privacy_and_compliance_details}}\n- Actionable Insights Format: {{actionable_insights_format}}\n- Topic Scope and Exclusions: {{topic_scope_and_exclusions}}\n\nProduce a structured research report including the following sections: Executive Summary, Research Methodology, Topic Overview, Key Findings, Comparative Analysis, Opportunities and Benefits, Risks and Challenges, Emerging Trends, Future Outlook, Confidence Assessment, and Conclusion. Include actionable insights and recommendations clearly identified within the report sections where appropriate. The report must be professional, objective, and suitable for decision-makers. Respect all data privacy and regulatory compliance constraints during research and report generation.\n\nOutput the complete structured report as JSON under the key 'research_report'. Also provide a status message under 'status' indicating success or failure, and a routing field 'ResearchReportAgent_route' with value 'success' if successful or 'failure' otherwise."
    provider: OpenAI
    model: gpt-5.4-mini
    reads_state:
      - topic
      - source_credibility_criteria
      - report_tone_and_style_guidelines
      - data_privacy_and_compliance_details
      - actionable_insights_format
      - topic_scope_and_exclusions
    writes_state:
      - research_report
      - status
      - ResearchReportAgent_route
    tools: []
    output_schema:
      type: object
      properties:
        research_report:
          type: object
          description: The structured comprehensive research report including all required sections and actionable insights.
          properties:
            Executive Summary:
              type: string
            Research Methodology:
              type: string
            Topic Overview:
              type: string
            Key Findings:
              type: string
            Comparative Analysis:
              type: string
            Opportunities and Benefits:
              type: string
            Risks and Challenges:
              type: string
            Emerging Trends:
              type: string
            Future Outlook:
              type: string
            Confidence Assessment:
              type: string
            Conclusion:
              type: string
            Actionable Insights and Recommendations:
              type: string
          required:
            - Executive Summary
            - Research Methodology
            - Topic Overview
            - Key Findings
            - Comparative Analysis
            - Opportunities and Benefits
            - Risks and Challenges
            - Emerging Trends
            - Future Outlook
            - Confidence Assessment
            - Conclusion
            - Actionable Insights and Recommendations
          additionalProperties: false
        status:
          type: string
          description: Status message indicating success or failure of the report generation.
          enum:
            - success
            - failure
        ResearchReportAgent_route:
          type: string
          description: Routing field for the ResearchReportAgent outcomes.
          enum:
            - success
            - failure
      required:
        - research_report
        - status
        - ResearchReportAgent_route
    output_mapping:
      research_report: research_report
      status: status
      ResearchReportAgent_route: ResearchReportAgent_route
  TerminalSuccessResponder:
    role: Final Report Responder
    prompt: "This node outputs the final successful research report and status.\nCheck current statuses and input presence before using optional or nullable inputs. Never invoke a tool or fabricate evidence when the data needed for that action is unavailable; return the declared failure or unavailable outcome and null for unavailable data. A terminal responder uses the available outcomes and must not require statuses from stages that were bypassed."
    provider: OpenAI
    model: gpt-5.4-mini
    reads_state:
      - research_report
      - status
    writes_state:
      - research_report
      - status
    tools: []
    output_schema:
      type: object
      properties:
        research_report:
          type: object
          description: The structured comprehensive research report including all required sections and actionable insights.
          properties:
            Executive Summary:
              type: string
            Research Methodology:
              type: string
            Topic Overview:
              type: string
            Key Findings:
              type: string
            Comparative Analysis:
              type: string
            Opportunities and Benefits:
              type: string
            Risks and Challenges:
              type: string
            Emerging Trends:
              type: string
            Future Outlook:
              type: string
            Confidence Assessment:
              type: string
            Conclusion:
              type: string
            Actionable Insights and Recommendations:
              type: string
          required:
            - Executive Summary
            - Research Methodology
            - Topic Overview
            - Key Findings
            - Comparative Analysis
            - Opportunities and Benefits
            - Risks and Challenges
            - Emerging Trends
            - Future Outlook
            - Confidence Assessment
            - Conclusion
            - Actionable Insights and Recommendations
          additionalProperties: false
        status:
          type: string
          description: Status message indicating success or failure of the report generation.
          enum:
            - success
            - failure
      required:
        - research_report
        - status
    output_mapping:
      research_report: research_report
      status: status
  TerminalFailureResponder:
    role: Failure Responder
    prompt: "This node outputs failure status and an empty report.\nCheck current statuses and input presence before using optional or nullable inputs. Never invoke a tool or fabricate evidence when the data needed for that action is unavailable; return the declared failure or unavailable outcome and null for unavailable data. A terminal responder uses the available outcomes and must not require statuses from stages that were bypassed."
    provider: OpenAI
    model: gpt-5.4-mini
    reads_state:
      - status
    writes_state:
      - research_report
      - status
    tools: []
    output_schema:
      type: object
      properties:
        research_report:
          type: object
          description: The structured comprehensive research report including all required sections and actionable insights.
          properties:
            Executive Summary:
              type: string
            Research Methodology:
              type: string
            Topic Overview:
              type: string
            Key Findings:
              type: string
            Comparative Analysis:
              type: string
            Opportunities and Benefits:
              type: string
            Risks and Challenges:
              type: string
            Emerging Trends:
              type: string
            Future Outlook:
              type: string
            Confidence Assessment:
              type: string
            Conclusion:
              type: string
            Actionable Insights and Recommendations:
              type: string
          required:
            - Executive Summary
            - Research Methodology
            - Topic Overview
            - Key Findings
            - Comparative Analysis
            - Opportunities and Benefits
            - Risks and Challenges
            - Emerging Trends
            - Future Outlook
            - Confidence Assessment
            - Conclusion
            - Actionable Insights and Recommendations
          additionalProperties: false
        status:
          type: string
          description: Status message indicating success or failure of the report generation.
          enum:
            - success
            - failure
      required:
        - research_report
        - status
    output_mapping:
      research_report: research_report
      status: status
